name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone HF Space repo
        run: |
          git clone https://hf:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Maheshpatgar488/resume-backend hf-sync

      - name: Copy files to HF clone
        run: |
          find hf-sync -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -av --exclude='node_modules' --exclude='.env' --exclude='.env.example' --exclude='backend/node_modules' --exclude='frontend/node_modules' --exclude='backend/public' --exclude='frontend/dist' --exclude='.git' --exclude='.github' ./ hf-sync/

      - name: Commit and push to HF Spaces
        run: |
          cd hf-sync
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "Sync from GitHub: ${{ github.sha }}"
            git push
          fi
