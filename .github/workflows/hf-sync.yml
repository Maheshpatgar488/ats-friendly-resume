name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push backend directory to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "HF Sync Bot"
          
          # Create a clean deployment directory
          mkdir -p deploy
          cp -r backend/* deploy/
          cd deploy
          
          # Initialize a fresh git repo and force push
          git init
          git add .
          git commit -m "Deploy to Hugging Face"
          git push https://Maheshpatgar488:${HF_TOKEN}@huggingface.co/spaces/Maheshpatgar488/resume-backend master:main --force
